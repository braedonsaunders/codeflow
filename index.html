    (connections||[]).forEach(function(c){
        var src=typeof c.source==='object'?c.source.id:c.source;
        var tgt=typeof c.target==='object'?c.target.id:c.target;
        if(src===path&&tgt)linked.add(tgt);
        if(tgt===path&&src)linked.add(src);
    });
    return Array.from(linked);
}

var CODE_CARD_MAX=12;

function defaultCodeViewSeed(data,folderFilter){
    if(!data||!data.files||!data.files.length)return null;
    var filtered=folderFilter?data.files.filter(function(f){return f.folder===folderFilter||f.folder.startsWith(folderFilter+'/');}):data.files;
    if(!filtered.length)return null;
    var byPath=Object.create(null);
    filtered.forEach(function(f){byPath[f.path]=f;});
    var counts=Object.create(null);
    (data.connections||[]).forEach(function(c){
        var src=typeof c.source==='object'?c.source.id:c.source;
        var tgt=typeof c.target==='object'?c.target.id:c.target;
        if(byPath[src])counts[src]=(counts[src]||0)+1;
        if(byPath[tgt])counts[tgt]=(counts[tgt]||0)+1;
    });
    var best=filtered[0];
    var bestN=counts[best.path]||0;
    filtered.forEach(function(file){
        var n=counts[file.path]||0;
        if(n>bestN){best=file;bestN=n;}
    });
    return best.path;
}

function fileMatchesFolderFilter(file,folderFilter){
    if(!folderFilter)return true;
    if(!file)return false;
    return file.folder===folderFilter||(!!file.folder&&file.folder.startsWith(folderFilter+'/'));
}

function pathMatchesFolderFilter(path,data,folderFilter){
    if(!folderFilter)return true;
    if(!data||!data.files||!path)return false;
    for(var i=0;i<data.files.length;i++){
        if(data.files[i].path===path)return fileMatchesFolderFilter(data.files[i],folderFilter);
    }
    return false;
}

function folderFilterAfterCodeNav(path,data,folderFilter){
    if(pathMatchesFolderFilter(path,data,folderFilter))return folderFilter||null;
    return null;
}

function codeViewSeedPath(selectedPath,data,folderFilter){
    if(!data||!data.files||!data.files.length)return null;
    if(selectedPath){
        var selected=null;
        for(var i=0;i<data.files.length;i++){
            if(data.files[i].path===selectedPath){selected=data.files[i];break;}
        }
        if(selected&&fileMatchesFolderFilter(selected,folderFilter))return selectedPath;
    }
    return defaultCodeViewSeed(data,folderFilter);
}

function shouldSeedOpenedCodeCards(inCode,sessionActive,openedPaths,gateActive){
    if(gateActive)return false;
    if(!inCode)return false;
    if(!sessionActive)return true;
    return !(openedPaths&&openedPaths.length);
}

function codeViewAnalysisRootFolder(data){
    if(!data||!data.files||!data.files.length)return'root';
    // Folder and ZIP loaders already strip a common archive prefix before
    // assigning folder. A remaining lone top-level directory (src/, lib/, …)
    // is nested project structure, not an analysis-root wrapper.
    return'root';
}

function isCodeViewRootFile(file,rootFolder){
    if(!file)return false;
    var folder=file.folder||'root';
    return folder===(rootFolder||'root');
}

function countCodeViewRootFiles(data){
    if(!data||!data.files)return 0;
    var root=codeViewAnalysisRootFolder(data);
    var n=0;
    for(var i=0;i<data.files.length;i++){
        if(isCodeViewRootFile(data.files[i],root))n++;
    }
    return n;
}

function codeViewRootGateActive(data,folderFilter,selectedPath,openedPaths,threshold){
    if(!data||!data.files||!data.files.length)return false;
    if(folderFilter)return false;
    if(selectedPath)return false;
    if(openedPaths&&openedPaths.length)return false;
    return countCodeViewRootFiles(data)>=clampCodeViewRootGate(threshold);
}

function codeViewRootGateMessage(count,threshold){
    return'This project root has '+count+' files (gate is '+clampCodeViewRootGate(threshold)+'). Pick a folder or file in the Files tree before opening Code cards.';
}

function codeFileNavOpensCard(vizType){

}

function graphSvgExportEnabled(vizType){

function vizUsesLineThickness(vizType){

}

function vizHasGraphToolbar(vizType){

}

function collectVisibleCodeFiles(selectedPath,data,folderFilter,limit){
    if(!data||!data.files)return[];
    var filtered=folderFilter?data.files.filter(function(f){return f.folder===folderFilter||f.folder.startsWith(folderFilter+'/');}):data.files;
    var byPath=Object.create(null);
    filtered.forEach(function(f){byPath[f.path]=f;});
    var ordered=[];
    function add(path){
        var file=byPath[path];
        if(!file||ordered.some(function(f){return f.path===path;}))return;
        ordered.push(file);
    }
    if(!selectedPath||!byPath[selectedPath])selectedPath=defaultCodeViewSeed(data,folderFilter);
    if(selectedPath)add(selectedPath);
    getConnectedFilePaths(selectedPath,data.connections).slice().sort(function(a,b){
        var loadedA=fileHasLoadedSource(byPath[a])?0:1;
        var loadedB=fileHasLoadedSource(byPath[b])?0:1;
        return loadedA-loadedB;
    }).forEach(add);
    var max=limit==null?CODE_CARD_MAX:Number(limit);
    if(!isFinite(max))return ordered;
    return ordered.slice(0,Math.max(0,max));
}

function countVisibleCodeFiles(selectedPath,data,folderFilter){
    return collectVisibleCodeFiles(selectedPath,data,folderFilter,Infinity).length;
}

function noteCodeCardPointerEnd(moved){

function consumeCodeCardClick(ignoreNextClick){

function codeCardDragDelta(clientX,clientY,startX,startY,scale,threshold){
    var screenX=(Number(clientX)||0)-(Number(startX)||0);
    var screenY=(Number(clientY)||0)-(Number(startY)||0);
    var k=Number(scale);
    if(!isFinite(k)||k<=0)k=1;
    var limit=threshold==null?3:Number(threshold);
    if(!isFinite(limit))limit=3;
    return{
        x:screenX/k,
        y:screenY/k,
        screenX:screenX,
        screenY:screenY,
        moved:Math.abs(screenX)+Math.abs(screenY)>limit
    };
}

var CODE_CARD_MIN_WIDTH=320;
var CODE_CARD_MAX_WIDTH=720;
var CODE_CARD_MIN_HEIGHT=160;
var CODE_CARD_MAX_HEIGHT=1840;
var CODE_CARD_LINE_HEIGHT=19;
var CODE_CARD_CHAR_WIDTH=7;
var CODE_CARD_HEAD_HEIGHT=42;
var CODE_CARD_BODY_PAD=16;
var CODE_CARD_GUTTER=72;

function codeCardContentMetrics(file){
    var content=file&&typeof file.content==='string'?file.content:'';
    var lines=content?content.split('\n'):[''];
    var maxLineChars=0;
    var lineChars=[];
    for(var i=0;i<lines.length;i++){
        var n=String(lines[i]).length;
        lineChars.push(n);
        if(n>maxLineChars)maxLineChars=n;
    }
    return{lines:Math.max(1,lines.length),maxLineChars:maxLineChars,lineChars:lineChars};
}

var CODE_CARD_WIDTH=440;

function normalizeCodeCardPrefs(prefs){
    prefs=prefs||{};
    return{expand:!!prefs.expand,wrap:!!prefs.wrap};
}

function codeCardWrapColumns(){
    return Math.max(1,Math.floor((CODE_CARD_WIDTH-CODE_CARD_GUTTER-CODE_CARD_BODY_PAD)/CODE_CARD_CHAR_WIDTH));
}

function codeCardWrappedLineCount(metrics,prefs){
    metrics=metrics||codeCardContentMetrics(null);
    prefs=normalizeCodeCardPrefs(prefs);
    if(!prefs.wrap)return Math.max(1,metrics.lines||1);
    var cols=codeCardWrapColumns();
    var chars=metrics.lineChars||[];
    var count=0;
    if(!chars.length)return Math.max(1,metrics.lines||1);
    for(var i=0;i<chars.length;i++){
        count+=Math.max(1,Math.ceil((chars[i]||0)/cols)||1);
    }
    return Math.max(1,count);
}

function codeCardVisualLineIndex(file,line,prefs){
    var n=Math.max(1,Number(line)||1);
    prefs=normalizeCodeCardPrefs(prefs);
    if(!prefs.wrap)return n;
    var metrics=codeCardContentMetrics(file);
    var cols=codeCardWrapColumns();
    var chars=metrics.lineChars||[];
    var visual=0;
    var lim=Math.min(chars.length,n-1);
    for(var i=0;i<lim;i++){
        visual+=Math.max(1,Math.ceil((chars[i]||0)/cols)||1);
    }
    return visual+1;
}

function codeCardNaturalWidth(metrics){
    metrics=metrics||{maxLineChars:0};
    return CODE_CARD_GUTTER+CODE_CARD_BODY_PAD+(metrics.maxLineChars||0)*CODE_CARD_CHAR_WIDTH;
}

function codeCardSize(file,prefs){
    prefs=normalizeCodeCardPrefs(prefs);
    var metrics=codeCardContentMetrics(file);
    var width=CODE_CARD_WIDTH;
    var naturalWidth=codeCardNaturalWidth(metrics);
    var visualLines=codeCardWrappedLineCount(metrics,prefs);
    var naturalHeight=CODE_CARD_HEAD_HEIGHT+CODE_CARD_BODY_PAD+visualLines*CODE_CARD_LINE_HEIGHT;
    var height=Math.max(CODE_CARD_MIN_HEIGHT,prefs.expand?naturalHeight:Math.min(CODE_CARD_MAX_HEIGHT,naturalHeight));
    var heightClipped=!prefs.expand&&naturalHeight>CODE_CARD_MAX_HEIGHT;
    var widthClipped=!prefs.wrap&&naturalWidth>width;
    return{width:width,height:height,clipped:heightClipped||widthClipped,expand:prefs.expand,wrap:prefs.wrap,naturalHeight:naturalHeight,naturalWidth:naturalWidth};
}

var CODE_CARD_RESIZE_MAX_WIDTH=1200;

function clampCodeCardResize(width,height,prefs){
    prefs=normalizeCodeCardPrefs(prefs);
    var w=Math.max(CODE_CARD_MIN_WIDTH,Math.min(CODE_CARD_RESIZE_MAX_WIDTH,Number(width)||CODE_CARD_WIDTH));
    var h=Math.max(CODE_CARD_MIN_HEIGHT,Number(height)||CODE_CARD_MIN_HEIGHT);
    if(!prefs.expand)h=Math.min(CODE_CARD_MAX_HEIGHT,h);
    return{width:w,height:h};
}

function applyCodeCardUserSize(base,override){
    base=base||codeCardSize(null);
    if(!override)return base;
    var next=clampCodeCardResize(override.width!=null?override.width:base.width,override.height!=null?override.height:base.height,base);
    var heightClipped=!base.expand&&(base.naturalHeight||0)>next.height;
    var widthClipped=!base.wrap&&(base.naturalWidth||0)>next.width;
    return Object.assign({},base,{width:next.width,height:next.height,clipped:heightClipped||widthClipped});
}

function codeCardResizeDelta(clientX,clientY,startX,startY,startW,startH,scale,edge){
    var k=Number(scale);
    if(!isFinite(k)||k<=0)k=1;
    var dx=((Number(clientX)||0)-(Number(startX)||0))/k;
    var dy=((Number(clientY)||0)-(Number(startY)||0))/k;
    var width=Number(startW)||CODE_CARD_WIDTH;
    var height=Number(startH)||CODE_CARD_MIN_HEIGHT;
    if(edge==='e'||edge==='se')width+=dx;
    if(edge==='s'||edge==='se')height+=dy;
    return{width:width,height:height,dx:dx,dy:dy};
}

function graphFolderCenters(folders,width,height,options){
    options=options||{};
    var list=[];
    (folders||[]).forEach(function(f){if(f!=null&&list.indexOf(f)<0)list.push(f);});
    var out=Object.create(null);
    if(!list.length)return out;
    var cols=Math.max(2,Math.ceil(Math.sqrt(list.length)));
    var rows=Math.max(1,Math.ceil(list.length/cols));
    var minW=options.minCellW==null?0:Number(options.minCellW)||0;
    var minH=options.minCellH==null?0:Number(options.minCellH)||0;
    var cw=Math.max(minW,(Number(width)||800)/(cols+1));
    var ch=Math.max(minH,(Number(height)||600)/(rows+1));
    list.forEach(function(f,i){
        out[f]={x:(i%cols+1)*cw,y:(Math.floor(i/cols)+1)*ch};
    });
    return out;
}

function leftoverCodeNodeGrid(count,spacing){
    spacing=spacing==null?56:Number(spacing)||56;
    count=Math.max(0,Math.floor(Number(count)||0));
    var out=[];
    if(count<=0)return out;
    var cols=Math.max(1,Math.ceil(Math.sqrt(count)));
    var rows=Math.max(1,Math.ceil(count/cols));
    var i;
    for(i=0;i<count;i++){
        var col=i%cols;
        var row=Math.floor(i/cols);
        out.push({
            x:(col-(cols-1)/2)*spacing,
            y:(row-(rows-1)/2)*spacing
        });
    }
    return out;
}

function parkLeftoverCodeNodes(nodes,cardPaths,centers,options){
    options=options||{};
    var spacing=options.spacing==null?56:options.spacing;
    var pin=options.pin!==false;
    var groups=Object.create(null);
    var order=[];
    (nodes||[]).forEach(function(node){
        if(!node)return;
        if(cardPaths&&cardPaths.has(node.id))return;
        if(node.fx!=null&&isFinite(Number(node.fx)))return;
        var folder=node.folder||'root';
        if(!groups[folder]){
            groups[folder]=[];
            order.push(folder);
        }
        groups[folder].push(node);
    });
    order.forEach(function(folder){
        var group=groups[folder];
        var c=centers&&centers[folder];
        if(!c||!isFinite(c.x)||!isFinite(c.y))return;
        var offs=leftoverCodeNodeGrid(group.length,spacing);
        group.forEach(function(node,i){
            node.x=c.x+offs[i].x;
            node.y=c.y+offs[i].y;
            if(pin){
                node.fx=node.x;
                node.fy=node.y;
            }
        });
    });
    return nodes;
}

function codeViewSiblingNodes(nodes,dragged,cardPaths){
    if(!dragged)return[];
    var folder=dragged.folder||'root';
    var out=[];
    (nodes||[]).forEach(function(node){
        if(!node||node===dragged||node.id===dragged.id)return;
        if(cardPaths&&cardPaths.has(node.id))return;
        if((node.folder||'root')!==folder)return;
        out.push(node);
    });
    return out;
}

function translateCodeViewSiblings(nodes,dragged,dx,dy,cardPaths){
    dx=Number(dx)||0;
    dy=Number(dy)||0;
    if(!dx&&!dy)return[];
    var siblings=codeViewSiblingNodes(nodes,dragged,cardPaths);
    siblings.forEach(function(node){
        if(isFinite(node.x))node.x+=dx;
        if(isFinite(node.y))node.y+=dy;
        if(node.fx!=null&&isFinite(Number(node.fx)))node.fx=node.x;
        if(node.fy!=null&&isFinite(Number(node.fy)))node.fy=node.y;
    });
    return siblings;
}

function nodeWorldBox(node,size){
    if(!node||!size)return null;
    var xy=liveGraphNodeXY(node);
    if(!xy)return null;
    var width=Number(size.width)||0;
    var height=Number(size.height)||0;
    if(width<=0||height<=0)return null;
    return{x:xy.x-width/2,y:xy.y-height/2,width:width,height:height};
}

function cardWorldBox(node,sizesByPath,boxesByPath){
    if(!node)return null;
    var size=(sizesByPath&&sizesByPath[node.id])||codeCardSize(null);
    var live=nodeWorldBox(node,size);
    var snap=boxesByPath&&boxesByPath[node.id];
    if(!snap)return live;
    if(!live)return snap;
    var liveCx=live.x+live.width/2,liveCy=live.y+live.height/2;
    var snapCx=snap.x+snap.width/2,snapCy=snap.y+snap.height/2;
    if(Math.abs(liveCx-snapCx)>0.5||Math.abs(liveCy-snapCy)>0.5){
        return{x:liveCx-snap.width/2,y:liveCy-snap.height/2,width:snap.width,height:snap.height};
    }
    return snap;
}

function resolveBoxOverlap(box,obstacles,gap){
    if(!box)return null;
    gap=gap==null?24:Number(gap)||0;
    var next={x:box.x,y:box.y,width:box.width,height:box.height};
    var pass;
    for(pass=0;pass<8;pass++){
        var hit=null;
        (obstacles||[]).forEach(function(obs){
            if(!hit&&boxesOverlap(next,obs,gap))hit=obs;
        });
        if(!hit)break;
        var slack=gap+1;
        var right=(hit.x+hit.width+slack)-next.x;
        var left=next.x+next.width+slack-hit.x;
        var down=(hit.y+hit.height+slack)-next.y;
        var up=next.y+next.height+slack-hit.y;
        if(right<=left&&right<=down&&right<=up)next.x+=right;
        else if(left<=down&&left<=up)next.x-=left;
        else if(down<=up)next.y+=down;
        else next.y-=up;
    }
    return next;
}

function bumpOverlappingCodeCards(nodes,droppedId,cardPaths,sizesByPath,gap){
    if(!droppedId)return null;
    var dropped=null;
    var obstacles=[];
    (nodes||[]).forEach(function(node){
        if(!node||!cardPaths||!cardPaths.has(node.id))return;
        var size=(sizesByPath&&sizesByPath[node.id])||codeCardSize(null);
        var box=nodeWorldBox(node,size);
        if(!box)return;
        if(node.id===droppedId)dropped={node:node,size:size,box:box};
        else obstacles.push(box);
    });
    if(!dropped)return null;
    var next=resolveBoxOverlap(dropped.box,obstacles,gap);
    if(!next)return dropped.node;
    dropped.node.x=dropped.node.fx=next.x+next.width/2;
    dropped.node.y=dropped.node.fy=next.y+next.height/2;
    return dropped.node;
}

function leftoverGroupBox(nodes,pad){
    var boxes=[];
    (nodes||[]).forEach(function(node){
        var xy=liveGraphNodeXY(node);
        if(!xy)return;
        boxes.push({x:xy.x-22,y:xy.y-22,width:44,height:44});
    });
    return unionPaddedBoxes(boxes,pad==null?16:pad,0);
}

function leftoverHullObstacles(nodes,cardPaths){
    var leftoversByFolder=Object.create(null);
    (nodes||[]).forEach(function(node){
        if(!node||(cardPaths&&cardPaths.has(node.id)))return;
        var folder=node.folder||'root';
        if(!leftoversByFolder[folder])leftoversByFolder[folder]=[];
        leftoversByFolder[folder].push(node);
    });
    var hulls=[];
    Object.keys(leftoversByFolder).forEach(function(folder){
        var hull=leftoverGroupBox(leftoversByFolder[folder],16);
        if(hull)hulls.push(hull);
    });
    return hulls;
}

function nudgeLeftoverGroupsFromCards(nodes,cardPaths,sizesByPath,pad,boxesByPath){
    pad=pad==null?40:pad;
    var cards=[];
    var leftoversByFolder=Object.create(null);
    (nodes||[]).forEach(function(node){
        if(!node)return;
        if(cardPaths&&cardPaths.has(node.id)){
            var box=cardWorldBox(node,sizesByPath,boxesByPath);
            if(box)cards.push(box);
            return;
        }
        var folder=node.folder||'root';
        if(!leftoversByFolder[folder])leftoversByFolder[folder]=[];
        leftoversByFolder[folder].push(node);
    });
    Object.keys(leftoversByFolder).forEach(function(folder){
        var group=leftoversByFolder[folder];
        var hull=leftoverGroupBox(group,16);
        if(!hull)return;
        var next=resolveBoxOverlap(hull,cards,pad);
        if(!next)return;
        var dx=next.x-hull.x;
        var dy=next.y-hull.y;
        if(!dx&&!dy)return;
        group.forEach(function(node){
            if(isFinite(node.x))node.x+=dx;
            if(isFinite(node.y))node.y+=dy;
            if(node.fx!=null)node.fx=node.x;
            if(node.fy!=null)node.fy=node.y;
        });
    });
    return nodes;
}

function leftoverSpatialCellKey(x,y,cell){
    var size=Number(cell);
    if(!isFinite(size)||size<=0)size=36;
    return Math.floor((Number(x)||0)/size)+'\t'+Math.floor((Number(y)||0)/size);
}

function leftoverSeparationNeighbors(a,b,gap){
    if(!a||!b||a===b)return false;
    var dx=b.x-a.x,dy=b.y-a.y;
    var dist=Math.hypot(dx,dy);
    if(dist>=gap)return false;
    var push=(gap-(dist||0.01))/2;
    var nx=dist<1e-6?1:dx/dist;
    var ny=dist<1e-6?0:dy/dist;
    a.x-=nx*push;
    a.y-=ny*push;
    b.x+=nx*push;
    b.y+=ny*push;
    if(a.fx!=null)a.fx=a.x;
    if(a.fy!=null)a.fy=a.y;
    if(b.fx!=null)b.fx=b.x;
    if(b.fy!=null)b.fy=b.y;
    return true;
}

function leftoverSeparationBuckets(leftovers,cell){
    var buckets=Object.create(null);
    (leftovers||[]).forEach(function(node,i){
        var key=leftoverSpatialCellKey(node.x,node.y,cell);
        if(!buckets[key])buckets[key]=[];
        buckets[key].push(i);
    });
    return buckets;
}

function separateLeftoverCodeNodes(nodes,cardPaths,gap){
    gap=gap==null?36:Number(gap)||36;
    var leftovers=[];
    (nodes||[]).forEach(function(node){
        if(!node||(cardPaths&&cardPaths.has(node.id)))return;
        if(!isFinite(node.x)||!isFinite(node.y))return;
        leftovers.push(node);
    });
    if(leftovers.length<2)return nodes;
    var cell=Math.max(gap,1);
    var pass,i,ox,oy;
    for(pass=0;pass<6;pass++){
        var buckets=leftoverSeparationBuckets(leftovers,cell);
        var moved=false;
        for(i=0;i<leftovers.length;i++){
            var a=leftovers[i];
            var cx=Math.floor(a.x/cell);
            var cy=Math.floor(a.y/cell);
            for(ox=-1;ox<=1;ox++){
                for(oy=-1;oy<=1;oy++){
                    var group=buckets[cx+ox+'\t'+(cy+oy)];
                    if(!group)continue;
                    group.forEach(function(j){
                        if(j<=i)return;
                        if(leftoverSeparationNeighbors(a,leftovers[j],gap))moved=true;
                    });
                }
            }
        }
        if(!moved)break;
    }
    return nodes;
}

function settleCodeViewAfterDrag(nodes,cardPaths,sizesByPath,droppedId,options){
    options=options||{};
    var boxesByPath=options.boxesByPath||null;
    var dropped=null;
    if(droppedId){
        (nodes||[]).some(function(node){
            if(node&&node.id===droppedId){dropped=node;return true;}
            return false;
        });
    }
    function applyDroppedDelta(before){
        if(!dropped||!before)return;
        var dx=dropped.x-before.x,dy=dropped.y-before.y;
        if(dx||dy)translateCodeViewSiblings(nodes,dropped,dx,dy,cardPaths);
    }
    var before=dropped?liveGraphNodeXY(dropped):null;
    if(dropped&&cardPaths&&cardPaths.has(dropped.id)){
        bumpOverlappingCodeCards(nodes,dropped.id,cardPaths,sizesByPath,options.cardGap==null?24:options.cardGap);
        applyDroppedDelta(before);
        before=liveGraphNodeXY(dropped);
    }
    var pass;
    for(pass=0;pass<3;pass++){
        nudgeLeftoverGroupsFromCards(nodes,cardPaths,sizesByPath,options.hullPad==null?40:options.hullPad,boxesByPath);
    }
    unburyNodesFromCards(nodes,cardPaths,sizesByPath,options.nodePad==null?48:options.nodePad,boxesByPath);
    if(dropped&&cardPaths&&cardPaths.has(dropped.id)){
        before=liveGraphNodeXY(dropped);
        var hulls=leftoverHullObstacles(nodes,cardPaths);
        var box=cardWorldBox(dropped,sizesByPath,boxesByPath);
        if(box&&hulls.length){
            var next=resolveBoxOverlap(box,hulls,options.hullPad==null?40:options.hullPad);
            if(next&&(next.x!==box.x||next.y!==box.y)){
                dropped.x=dropped.fx=next.x+next.width/2;
                dropped.y=dropped.fy=next.y+next.height/2;
                applyDroppedDelta(before);
            }
        }
    }
    separateLeftoverCodeNodes(nodes,cardPaths,options.nodeGap==null?40:options.nodeGap);
    return nodes;
}

function codeViewDragRefresh(phase){

}

function raiseCodeCardStack(order,path){
    var next=[];

}

function applyCodeCardStackOrder(layer,order){

function boxesOverlap(a,b,gap){
    if(!a||!b)return false;
    gap=gap==null?0:Number(gap)||0;
    return !(a.x>b.x+b.width+gap||a.x+a.width<b.x-gap||a.y>b.y+b.height+gap||a.y+a.height<b.y-gap);
}

function codeCardCollisionRadius(size){
    size=size||codeCardSize(null);
    return Math.round(Math.hypot(size.width,size.height)/2)+18;
}

function liveCodeCollideRadius(node,size){
    if(size)return codeCardCollisionRadius(size);
    return Math.max(8,Math.min(24,5+((node&&node.fnCount)||0)*0.8))+12;
}

function layoutCodeCardsByFolder(files,sizesByPath,options){
    options=options||{};
    var gapX=options.gapX==null?56:options.gapX;
    var gapY=options.gapY==null?48:options.gapY;
    var groupGapX=options.groupGapX==null?96:options.groupGapX;
    var groupGapY=options.groupGapY==null?120:options.groupGapY;
    var originX=options.originX==null?80:options.originX;
    var originY=options.originY==null?80:options.originY;
    var maxRowWidth=options.maxRowWidth==null?2400:options.maxRowWidth;
    var groups=Object.create(null);
    var folderOrder=[];
    (files||[]).forEach(function(file){
        var folder=file&&file.folder?file.folder:'root';
        if(!groups[folder]){groups[folder]=[];folderOrder.push(folder);}
        groups[folder].push(file);
    });
    var placed=Object.create(null);
    var gx=originX,gy=originY,rowH=0;
    folderOrder.forEach(function(folder){
        var items=groups[folder];
        var cols=Math.max(1,Math.ceil(Math.sqrt(items.length)));
        var colWidths=[],rowHeights=[];
        items.forEach(function(file,i){
            var size=(sizesByPath&&sizesByPath[file.path])||codeCardSize(file);
            var col=i%cols,row=Math.floor(i/cols);
            colWidths[col]=Math.max(colWidths[col]||0,size.width);
            rowHeights[row]=Math.max(rowHeights[row]||0,size.height);
        });
        var colX=[],x=0;
        colWidths.forEach(function(w){colX.push(x);x+=w+gapX;});
        var rowY=[],y=36;
        rowHeights.forEach(function(h){rowY.push(y);y+=h+gapY;});
        var groupW=Math.max(0,x-gapX);
        var groupH=Math.max(0,y-gapY);
        if(gx>originX&&gx+groupW>originX+maxRowWidth){
            gx=originX;
            gy+=rowH+groupGapY;
            rowH=0;
        }
        items.forEach(function(file,i){
            var size=(sizesByPath&&sizesByPath[file.path])||codeCardSize(file);
            var col=i%cols,row=Math.floor(i/cols);
            placed[file.path]={
                x:gx+colX[col]+size.width/2,
                y:gy+rowY[row]+size.height/2,
                folder:folder
            };
        });
        gx+=groupW+groupGapX;
        rowH=Math.max(rowH,groupH);
    });
    return placed;
}

function pathIsFlagged(map,path){
    if(!path||!map)return false;
    if(typeof map.has==='function')return map.has(path);
    return !!map[path];
}

function hiddenOpenedCodePaths(paths,data,folderFilter){
    var hidden=Object.create(null);
    if(!folderFilter)return hidden;
    var visible=Object.create(null);
    filesForOpenedCodePaths(paths,data,folderFilter).forEach(function(file){
        if(file&&file.path)visible[file.path]=true;
    });
    (paths||[]).forEach(function(path){
        if(path&&!visible[path])hidden[path]=true;
    });
    return hidden;
}

function codeCardPlacementKeepSet(openedPaths,visibleFiles){
    var keep=Object.create(null);
    (openedPaths||[]).forEach(function(path){if(path)keep[path]=true;});
    (visibleFiles||[]).forEach(function(file){if(file&&file.path)keep[file.path]=true;});
    return keep;
}

function pruneCodeCardPlacements(placements,keep){
    var departed=Object.create(null);
    Object.keys(placements||{}).forEach(function(path){
        if(keep&&keep[path])return;
        departed[path]=true;
        delete placements[path];
    });
    return departed;
}

function evictHiddenCodeCards(list,hidden,count){
    var need=Number(count);
    if(!isFinite(need)||need<=0)return (list||[]).slice();
    var removed=0;
    return (list||[]).filter(function(path){
        if(removed>=need)return true;
        if(pathIsFlagged(hidden,path)){
            removed++;
            return false;
        }
        return true;
    });
}

function openCodeCardPaths(prev,path,limit,replace,hidden){
    var list=(prev||[]).slice();
    if(!path)return list;
    if(list.indexOf(path)>=0)return list;
    var max=limit==null?CODE_CARD_MAX:Number(limit);
    if(isFinite(max)&&list.length>=max){
        var need=list.length-max+1;
        if(hidden)list=evictHiddenCodeCards(list,hidden,need);
        if(list.length>=max){
            if(!replace)return list;
            list=list.slice(Math.max(0,list.length-max+1));
        }
    }
    list.push(path);
    return list;
}

function resolveOpenCodeCard(prev,path,limit,replace,hidden){
    var before=prev||[];
    var next=openCodeCardPaths(before,path,limit,replace,hidden);
    var already=!!(path&&before.indexOf(path)>=0);
    var inserted=!!(path&&!already&&next.indexOf(path)>=0);
    return{paths:next,already:already,inserted:inserted,opened:already||inserted};
}

function ensureCodeViewOpenedPaths(openedPaths,selectedPath,data,folderFilter){
    var seed=codeViewSeedPath(selectedPath,data,folderFilter);
    if(!seed)return{paths:openedPaths||[],seed:null,opened:false,inserted:false};
    var resolved=resolveOpenCodeCard(openedPaths,seed,null,true,hiddenOpenedCodePaths(openedPaths,data,folderFilter));
    return{paths:resolved.paths,seed:seed,opened:resolved.opened,inserted:resolved.inserted};
}

function filesForOpenedCodePaths(paths,data,folderFilter){
    if(!data||!data.files)return[];
    var filtered=folderFilter?data.files.filter(function(f){return f.folder===folderFilter||f.folder.startsWith(folderFilter+'/');}):data.files;
    var byPath=Object.create(null);
    filtered.forEach(function(file){byPath[file.path]=file;});
    return(paths||[]).map(function(path){return byPath[path];}).filter(Boolean);
}

function appendCodeCardPlacement(placements,file,size,options){
    options=options||{};
    var gapX=options.gapX==null?88:options.gapX;
    var gapY=options.gapY==null?36:options.gapY;
    var originX=options.originX==null?80:options.originX;
    var originY=options.originY==null?72:options.originY;
    var next=Object.assign(Object.create(null),placements||{});
    if(!file||!file.path)return next;
    size=size||codeCardSize(file);
    var folder=file.folder||'root';
    var prev=next[file.path];
    if(prev){
        next[file.path]={
            left:prev.left,
            top:prev.top,
            x:prev.left+size.width/2,
            y:prev.top+size.height/2,
            width:size.width,
            height:size.height,
            folder:prev.folder||folder
        };
        return reflowUnpinnedCodeCards(next,options.pinnedPaths,options);
    }
    var same=[];
    var folderLeft=null;
    Object.keys(next).forEach(function(id){
        var item=next[id];
        if(!item||item.folder!==folder)return;
        same.push(item);
        folderLeft=folderLeft==null?item.left:Math.min(folderLeft,item.left);
    });
    var left,top;
    if(!same.length){
        var center=options.centers&&options.centers[folder];
        if(center&&isFinite(center.x)&&isFinite(center.y)){
            left=center.x-size.width/2;
            top=center.y-size.height/2;
        }else{
            var maxRight=originX;
            Object.keys(next).forEach(function(id){
                var item=next[id];
                if(!item)return;
                maxRight=Math.max(maxRight,item.left+item.width+gapX);
            });
            left=Object.keys(next).length?maxRight:originX;
            top=originY;
        }
    }else{
        left=folderLeft;
        var maxBottom=originY;
        same.forEach(function(item){maxBottom=Math.max(maxBottom,item.top+item.height+gapY);});
        top=maxBottom;
    }
    next[file.path]={
        left:left,
        top:top,
        x:left+size.width/2,
        y:top+size.height/2,
        width:size.width,
        height:size.height,
        folder:folder
    };
    return reflowUnpinnedCodeCards(next,options.pinnedPaths,options);
}

function codePathIsPinned(pinnedPaths,path){
    if(!path||!pinnedPaths)return false;
    if(typeof pinnedPaths.has==='function')return pinnedPaths.has(path);
    return !!pinnedPaths[path];
}

function reflowUnpinnedCodeCards(placements,pinnedPaths,options){
    options=options||{};
    var gapY=options.gapY==null?36:options.gapY;
    var originY=options.originY==null?72:options.originY;
    var next=placements||Object.create(null);
    var byFolder=Object.create(null);
    Object.keys(next).forEach(function(path){
        var item=next[path];
        if(!item)return;
        var folder=item.folder||'root';
        if(!byFolder[folder])byFolder[folder]=[];
        byFolder[folder].push(path);
    });
    Object.keys(byFolder).forEach(function(folder){
        var paths=byFolder[folder];
        paths.sort(function(a,b){
            var dy=(next[a].top||0)-(next[b].top||0);
            if(dy)return dy;
            return a<b?-1:a>b?1:0;
        });
        var center=options.centers&&options.centers[folder];
        var startY=originY;
        if(center&&isFinite(center.y)){
            var firstH=next[paths[0]]&&next[paths[0]].height;
            startY=center.y-((firstH||CODE_CARD_MIN_HEIGHT)/2);
        }
        var cursor=startY;
        paths.forEach(function(path){
            var item=Object.assign({},next[path]);
            next[path]=item;
            if(codePathIsPinned(pinnedPaths,path)){
                item.x=item.left+item.width/2;
                item.y=item.top+item.height/2;
                cursor=Math.max(cursor,item.top+item.height+gapY);
                return;
            }
            item.top=cursor;
            item.x=item.left+item.width/2;
            item.y=item.top+item.height/2;
            cursor=item.top+item.height+gapY;
        });
    });
    return next;
}

function codeCardSymbolLine(file,name){
    if(!file||!name)return null;
    var fns=file.functions||[];
    var i;
    for(i=0;i<fns.length;i++){
        if(fns[i]&&fns[i].name===name&&fns[i].line)return fns[i].line;
    }
    var content=String(file.content||'');
    if(!content)return null;
    var escaped=String(name).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    var re=new RegExp('(?:^|[^A-Za-z0-9_$])'+escaped+'(?:[^A-Za-z0-9_$]|$)');
    var lines=content.split('\n');
    for(i=0;i<lines.length;i++){
        if(re.test(lines[i]))return i+1;
    }
    return null;
}

function codeCardLineY(size,line,file,prefs){
    var n=Math.max(1,Number(line)||1);
    var visual=file?codeCardVisualLineIndex(file,n,prefs):n;
    return CODE_CARD_HEAD_HEIGHT+8+(visual-0.5)*CODE_CARD_LINE_HEIGHT;
}

function codeLinkPrefersVertical(src,tgt){
    if(!src||!tgt||!isFinite(src.x)||!isFinite(tgt.x))return false;
    return Math.abs(src.x-tgt.x)<1;
}

function codeEdgeBezier(x1,y1,x2,y2){
    var dxAbs=Math.abs(x2-x1);
    var dyAbs=Math.abs(y2-y1);
    if(dxAbs<1&&dyAbs>0){
        var vspan=Math.max(80,dyAbs*0.45);
        var dy=(y2<y1?-1:1)*vspan;
        return 'M'+x1+','+y1+'C'+x1+','+(y1+dy)+' '+x2+','+(y2-dy)+' '+x2+','+y2;
    }
    var span=Math.max(80,dxAbs*0.45);
    var dx=(x2<x1?-1:1)*span;
    return 'M'+x1+','+y1+'C'+(x1+dx)+','+y1+' '+(x2-dx)+','+y2+' '+x2+','+y2;
}

function layoutOpenedCodeCards(files,prev,sizesByPath,options){
    var placements=Object.assign(Object.create(null),prev||{});
    (files||[]).forEach(function(file){
        placements=appendCodeCardPlacement(placements,file,sizesByPath&&file?sizesByPath[file.path]:null,options);
    });
    return placements;
}

function codeViewWheelAction(event){
    if(event&&(event.ctrlKey||event.metaKey))return 'zoom';
    return 'pan';
}

function codeViewWheelPanDelta(deltaX,deltaY,scale){
    var k=Number(scale);
    if(!isFinite(k)||k<=0)k=1;
    return{x:-(Number(deltaX)||0)/k,y:-(Number(deltaY)||0)/k};
}

function nextCodeSourceReads(neededPaths,inFlight,failed){
    inFlight=inFlight||Object.create(null);
    return(neededPaths||[]).filter(function(path){
        return !!path&&!inFlight[path]&&!pathIsFlagged(failed,path);
    });
}

function codeCardAnchorY(node,size,line){
    size=size||codeCardSize(null);
    var y=line?codeCardLineY(size,line):CODE_CARD_HEAD_HEIGHT+(size.height-CODE_CARD_HEAD_HEIGHT)/2;
    if(!isFinite(y))y=size.height/2;
    y=Math.max(CODE_CARD_HEAD_HEIGHT+6,Math.min(size.height-8,y));
    return (node&&isFinite(node.y)?node.y:0)-size.height/2+y;
}

function codeCardLinkEndpoint(node,size,file,other,fn,isCard,vertical){
    if(!isCard)return{x:node.x,y:node.y};
    size=size||codeCardSize(file);
    if(vertical){
        var top=node.y-size.height/2;
        var bottom=node.y+size.height/2;
        var towardY=other&&isFinite(other.y)?other.y:bottom+1;
        return{x:node.x,y:towardY<node.y?top:bottom};
    }
    var line=fn?codeCardSymbolLine(file,fn):null;
    var y=codeCardAnchorY(node,size,line);
    var left=node.x-size.width/2;
    var right=node.x+size.width/2;
    var toward=other&&isFinite(other.x)?other.x:right+1;
    return{x:toward<node.x?left:right,y:y};
}

function codeCardLinkPath(link,sizesByPath,filesByPath,cardPaths){
    var src=link&&link.source;
    var tgt=link&&link.target;
    if(!src||!tgt||typeof src!=='object'||typeof tgt!=='object')return null;
    var srcIsCard=!!(cardPaths&&cardPaths.has(src.id));
    var tgtIsCard=!!(cardPaths&&cardPaths.has(tgt.id));
    if(!srcIsCard&&!tgtIsCard)return null;
    if(!isFinite(src.x)||!isFinite(src.y)||!isFinite(tgt.x)||!isFinite(tgt.y))return null;
    var srcFile=filesByPath&&filesByPath[src.id];
    var tgtFile=filesByPath&&filesByPath[tgt.id];
    var srcSize=(sizesByPath&&sizesByPath[src.id])||codeCardSize(srcFile);
    var tgtSize=(sizesByPath&&sizesByPath[tgt.id])||codeCardSize(tgtFile);
    var fn=link.fn;
    var vertical=codeLinkPrefersVertical(src,tgt);
    var p1=codeCardLinkEndpoint(src,srcSize,srcFile,tgt,fn,srcIsCard,vertical);
    var p2=codeCardLinkEndpoint(tgt,tgtSize,tgtFile,src,fn,tgtIsCard,vertical);
    return codeEdgeBezier(p1.x,p1.y,p2.x,p2.y);
}

function liveGraphNodeXY(node){
    if(!node)return null;
    var x=node.fx!=null&&isFinite(Number(node.fx))?Number(node.fx):Number(node.x);
    var y=node.fy!=null&&isFinite(Number(node.fy))?Number(node.fy):Number(node.y);
    if(!isFinite(x)||!isFinite(y))return null;
    return{x:x,y:y};
}

function readCodeCardWorldBox(card){
    if(!card||!card.style)return null;

    var y=parseFloat(card.style.top);

    var height=parseFloat(card.style.height);
    if(!isFinite(x)||!isFinite(y)||!isFinite(width)||!isFinite(height)||width<=0||height<=0)return null;
    return{x:x,y:y,width:width,height:height};
}

function readCodeCardWorldBoxes(layer){

function codeFolderMemberBox(node,sizesByPath,boxesByPath,fallbackR){
    if(!node)return null;
    if(boxesByPath&&boxesByPath[node.id])return boxesByPath[node.id];
    var xy=liveGraphNodeXY(node);
    if(!xy)return null;
    var size=sizesByPath&&sizesByPath[node.id];
    if(size&&isFinite(size.width)&&isFinite(size.height)){
        return{x:xy.x-size.width/2,y:xy.y-size.height/2,width:size.width,height:size.height};
    }
    if(fallbackR){
        return{x:xy.x-fallbackR,y:xy.y-fallbackR,width:fallbackR*2,height:fallbackR*2};
    }
    size=codeCardSize(null);
    return{x:xy.x-size.width/2,y:xy.y-size.height/2,width:size.width,height:size.height};
}

function unionPaddedBoxes(boxes,pad,labelExtra){
    pad=pad==null?24:pad;
    labelExtra=labelExtra==null?22:labelExtra;
    var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    (boxes||[]).forEach(function(box){
        if(!box||!isFinite(box.x)||!isFinite(box.y)||!isFinite(box.width)||!isFinite(box.height))return;
        minX=Math.min(minX,box.x);
        minY=Math.min(minY,box.y);
        maxX=Math.max(maxX,box.x+box.width);
        maxY=Math.max(maxY,box.y+box.height);
    });
    if(!isFinite(minX))return null;
    return{x:minX-pad,y:minY-pad-labelExtra,width:maxX-minX+pad*2,height:maxY-minY+pad*2+labelExtra};
}

function codeFolderCardBounds(nodes,sizesByPath,pad,boxesByPath){
    var boxes=[];
    (nodes||[]).forEach(function(node){
        var box=codeFolderMemberBox(node,sizesByPath,boxesByPath,0);
        if(box)boxes.push(box);
    });
    return unionPaddedBoxes(boxes,pad,22);
}

function codeFolderHullsByFolder(groups,sizesByPath,pad,boxesByPath){
    var out=Object.create(null);
    Object.keys(groups||{}).forEach(function(folder){
        var group=groups[folder]||{};
        out[folder]=codeFolderHullBounds(group.cards||[],group.leftover||[],sizesByPath,pad,boxesByPath);
    });
    return out;
}

function codeFolderHullBounds(cardNodes,leftoverNodes,sizesByPath,pad,boxesByPath){
    var boxes=[];
    (cardNodes||[]).forEach(function(node){
        var box=codeFolderMemberBox(node,sizesByPath,boxesByPath,0);
        if(box)boxes.push(box);
    });
    var cardUnion=unionPaddedBoxes(boxes,0,0);
    (leftoverNodes||[]).forEach(function(node){
        var box=codeFolderMemberBox(node,sizesByPath,null,30);
        if(!box)return;
        if(cardUnion&&!boxesOverlap(box,cardUnion,240))return;
        boxes.push(box);
    });
    return unionPaddedBoxes(boxes,pad==null?40:pad,22);
}

            if(size.expand&&card.classList.add)card.classList.add('expand');

function extractFileSymbols(file,connections){
    var symbols=[];
    var seen=Object.create(null);
    function add(name,kind){
        if(!isValidSymbolName(name)||seen[name])return;
        seen[name]=true;
        symbols.push({name:name,kind:kind||'var'});
    }
    (file&&file.functions||[]).forEach(function(fn){
        add(fn.name,fn.isExported?'export':'fn');
    });
    var content=String(file&&file.content||'');
    var match;
    var importRe=/\bimport\s+(?!\()([\s\S]*?)\s+from\s*['"`][^'"`]+['"`]/g;
    while((match=importRe.exec(content))){
        var spec=match[1]||'';
        if(/^\s*type\b/.test(spec))continue;
        var named=spec.match(/\{([\s\S]*?)\}/);
        if(named){
            named[1].split(',').forEach(function(part){
                part=part.trim().replace(/^type\s+/,'').trim();
                var alias=part.match(/^([A-Za-z_$][\w$]*)\s+as\s+([A-Za-z_$][\w$]*)$/);
                add(alias?alias[2]:part.replace(/[^\w$].*$/,''),'import');
            });
        }
        var ns=spec.match(/\*\s+as\s+([A-Za-z_$][\w$]*)/);
        if(ns)add(ns[1],'import');
        var def=spec.split('{')[0].split('*')[0].split(',')[0].trim();
        if(isValidSymbolName(def))add(def,'import');
    }
    var exportRe=/\bexport\s+(?:default\s+)?(?:async\s+)?(?:function|class|const|let|var)\s+([A-Za-z_$][\w$]*)/g;
    while((match=exportRe.exec(content)))add(match[1],'export');
    var namedExportRe=/\bexport\s+(?:default\s+)?\{([\s\S]*?)\}/g;
    while((match=namedExportRe.exec(content))){
        match[1].split(',').forEach(function(part){
            part=part.trim();
            var alias=part.match(/^([A-Za-z_$][\w$]*)\s+as\s+([A-Za-z_$][\w$]*)$/);
            add(alias?alias[1]:part.replace(/[^\w$].*$/,''),'export');
        });
    }
    var pyFromRe=/^\s*from\s+[.\w]+\s+import\s+([^\n#]+)/gm;
    while((match=pyFromRe.exec(content))){
        match[1].replace(/[()]/g,'').split(',').forEach(function(part){
            var pieces=part.trim().split(/\s+as\s+/);
            add((pieces[1]||pieces[0]||'').trim(),'import');
        });
    }
    (connections||[]).forEach(function(c){
        var src=typeof c.source==='object'?c.source.id:c.source;
        var tgt=typeof c.target==='object'?c.target.id:c.target;
        if(file&&(src===file.path||tgt===file.path)&&c.fn)add(c.fn,'fn');
    });
    return symbols;
}

function collectCrossFileSymbols(files,connections){
    var byName=Object.create(null);
    (files||[]).forEach(function(file){
        extractFileSymbols(file,connections).forEach(function(sym){
            if(!byName[sym.name])byName[sym.name]={name:sym.name,kind:sym.kind,files:[]};
            if(byName[sym.name].files.indexOf(file.path)<0)byName[sym.name].files.push(file.path);
            if(sym.kind==='export')byName[sym.name].kind='export';
            else if(sym.kind==='import'&&byName[sym.name].kind!=='export')byName[sym.name].kind='import';
        });
    });
    return Object.keys(byName).map(function(name){return byName[name];})
        .sort(function(a,b){return (b.files.length-a.files.length)||a.name.localeCompare(b.name);});
}

function annotateHtmlWithSymbols(html,symbols,activeSymbol){
    var source=String(html||'');
    if(!source||!symbols||!symbols.length)return source;
    var names=symbols.map(function(s){return s.name;}).filter(isValidSymbolName);
    if(!names.length)return source;
    var kindByName=Object.create(null);
    symbols.forEach(function(s){if(isValidSymbolName(s.name))kindByName[s.name]=s.kind||'var';});
    var re=new RegExp('\\b('+names.map(escapeRegExp).join('|')+')\\b','g');
    var out='';
    var last=0;
    var match;
    while((match=re.exec(source))){
        var idx=match.index;
        var before=source.slice(0,idx);
        var lastLt=before.lastIndexOf('<');
        var lastGt=before.lastIndexOf('>');
        if(lastLt>lastGt)continue;
        out+=source.slice(last,idx);
        var kind=safeSymbolKind(kindByName[match[1]]||'var');
        var active=activeSymbol&&activeSymbol===match[1]?' active':'';
        var safeName=escapeHtmlAttr(match[1]);
        out+='<span class="sym-mark '+kind+active+'" data-sym="'+safeName+'">'+safeName+'</span>';
        last=idx+match[0].length;
    }
    return out+source.slice(last);
}

function omitSnippetCode(item){
    if(!item||typeof item!=='object'||Array.isArray(item))return item;
    if(!Object.prototype.hasOwnProperty.call(item,'code'))return item;
    var copy=Object.assign({},item);
    delete copy.code;
    return copy;
}

function fileHasLoadedSource(file){
    return !!(file&&Object.prototype.hasOwnProperty.call(file,'content')&&typeof file.content==='string');
}

function fileHasPersistedSource(file){

}

function analysisFileNeedsSource(file){

}

function recordCodeSourceFailure(prev,path){
    var next=Object.assign(Object.create(null),prev||{});
    if(path)next[path]=true;
    return next;
}

function clearCodeSourceFailure(prev,path){
    var next=Object.assign(Object.create(null),prev||{});
    if(path)delete next[path];
    return next;
}

function recordCodeSourceFailureIfCurrent(prev,path,hydrationId,currentId){
    if(!hydrationRequestIsCurrent(hydrationId,currentId))return prev||Object.create(null);
    return recordCodeSourceFailure(prev,path);
}

function clearCodeSourceFailureIfCurrent(prev,path,hydrationId,currentId){
    if(!hydrationRequestIsCurrent(hydrationId,currentId))return prev||Object.create(null);

function fileSourceDisplayState(file,canFetch,failed){

    if(file.analysisSkipped)return 'skipped';
    if(fileHasLoadedSource(file))return 'ready';
    if(canFetch&&pathIsFlagged(failed,file.path))return 'failed';
    return canFetch?'loading':'unavailable';
}

function filesNeedingSource(files){

function mergeHydratedFileSources(data,updates,currentId){
    if(!data||!data.files||!updates||!updates.length)return data;
    var byPath=Object.create(null);
    updates.forEach(function(update){
        if(!hydratedSourceIsCurrent(update,currentId))return;
        byPath[update.path]=update.content;
    });
    var changed=false;
    var files=data.files.map(function(file){
        if(byPath[file.path]==null||fileHasLoadedSource(file))return file;
        changed=true;
        return Object.assign({},file,{content:byPath[file.path]});
    });
    return changed?Object.assign({},data,{files:files}):data;
}

function compactAnalysisForCache(data){
    if(!data||typeof data!=='object')return data;
    var copy=Object.assign({},data);
    if(Array.isArray(copy.files)){
        copy.files=copy.files.map(function(file){
            var next=Object.assign({},file);
            delete next.content;
            if(Array.isArray(next.functions))next.functions=next.functions.map(omitSnippetCode);
            if(Array.isArray(next.deadFunctions))next.deadFunctions=next.deadFunctions.map(omitSnippetCode);
            if(Array.isArray(next.securityIssues))next.securityIssues=next.securityIssues.map(omitSnippetCode);
            return next;
        });
    }
    if(Array.isArray(copy.functions))copy.functions=copy.functions.map(omitSnippetCode);
    if(Array.isArray(copy.deadFunctions))copy.deadFunctions=copy.deadFunctions.map(omitSnippetCode);
    if(Array.isArray(copy.securityIssues))copy.securityIssues=copy.securityIssues.map(omitSnippetCode);
    if(Array.isArray(copy.issues)){
        copy.issues=copy.issues.map(function(issue){
            var next=Object.assign({},issue);
            if(Array.isArray(next.items))next.items=next.items.map(omitSnippetCode);
            return next;
        });
    }
    if(copy.fnStats&&typeof copy.fnStats==='object'){
        var stats=Object.create(null);
        Object.keys(copy.fnStats).forEach(function(key){
            stats[key]=omitSnippetCode(copy.fnStats[key]);
        });
        copy.fnStats=stats;
    }
    return copy;
}

function openAnalysisCacheDb(){
    if(typeof indexedDB==='undefined')return Promise.reject(new Error('IndexedDB is not available'));
    return new Promise(function(resolve,reject){
        var req=indexedDB.open(ANALYSIS_CACHE_DB,ANALYSIS_CACHE_VERSION);
        req.onupgradeneeded=function(){
            var db=req.result;
            if(db.objectStoreNames.contains(ANALYSIS_CACHE_STORE))db.deleteObjectStore(ANALYSIS_CACHE_STORE);
            var store=db.createObjectStore(ANALYSIS_CACHE_STORE,{keyPath:'id'});

        req.onsuccess=function(){resolve(req.result);};
        req.onerror=function(){reject(req.error||new Error('Failed to open analysis cache'));};

}

function saveRecentAnalysis(record){
    if(!record||!record.id||!record.data)return Promise.resolve(false);
    if(estimateAnalysisRecordBytes(record)>ANALYSIS_CACHE_MAX_BYTES)return Promise.resolve(false);
    return openAnalysisCacheDb().then(function(db){
        return new Promise(function(resolve,reject){
            var tx=db.transaction(ANALYSIS_CACHE_STORE,'readwrite');
            var store=tx.objectStore(ANALYSIS_CACHE_STORE);
            store.put(record);
            var allReq=store.getAll();
            allReq.onsuccess=function(){
                var rows=(allReq.result||[]).slice().sort(function(a,b){return (b.savedAt||0)-(a.savedAt||0);});
                rows.slice(ANALYSIS_CACHE_MAX).forEach(function(old){store.delete(old.id);});
            };
            tx.oncomplete=function(){resolve(true);};
            tx.onerror=function(){reject(tx.error);};
        });
    }).catch(function(){return false;});
}

function resolveSafeCliPath(root,relPath){
    var rootPath=String(root||'').replace(/\\/g,'/').replace(/\/+$/,'');
    var rel=String(relPath||'').replace(/\\/g,'/');
    if(!rel||rel.charAt(0)==='/'||rel.indexOf('..')>=0)return null;
    return rootPath+'/'+rel;
}

function calcPRRisk(prData, repoData) {
    if (!prData || !repoData) return { score: 0, level: 'low', factors: [] };
    var score = 0;
    var factors = [];
    var changedFiles = prData.files || [];
    var totalBlast = 0;
    var hotspots = [];
    changedFiles.forEach(function(f) {
        var existing = repoData.files.find(function(df) { return df.path === f.filename; });
        if (existing) {
            var blast = calcBlast(f.filename, repoData.connections, repoData.files);
            totalBlast += blast.count;
            if (blast.count > 5) hotspots.push({ file: f.filename, blast: blast.count });
        }
    });
    if (totalBlast > 50) { score += 30; factors.push('High blast radius (' + totalBlast + ' files)'); }
    else if (totalBlast > 20) { score += 15; factors.push('Moderate blast radius'); }
    if (changedFiles.length > 10) { score += 20; factors.push('Many files changed (' + changedFiles.length + ')'); }
    else if (changedFiles.length > 5) { score += 10; factors.push('Several files changed'); }
    var totalChanges = (prData.additions || 0) + (prData.deletions || 0);
    if (totalChanges > 500) { score += 25; factors.push('Large changeset (' + totalChanges + ' lines)'); }
    else if (totalChanges > 200) { score += 12; factors.push('Moderate changeset'); }
    var coreFiles = changedFiles.filter(function(f) { return f.filename.includes('/core/') || f.filename.includes('/utils/') || f.filename.includes('/lib/'); });
    if (coreFiles.length > 0) { score += 15; factors.push('Core files modified (' + coreFiles.length + ')'); }
    var configFiles = changedFiles.filter(function(f) { return f.filename.match(/\.(json|yaml|yml|toml|env)$/); });
    if (configFiles.length > 0) { score += 10; factors.push('Config files changed'); }
    score = Math.min(100, score);
    var level = score >= 70 ? 'critical' : score >= 40 ? 'high' : score >= 20 ? 'medium' : 'low';
    return { score: score, level: level, factors: factors, totalBlast: totalBlast, hotspots: hotspots.sort(function(a,b){ return b.blast - a.blast; }).slice(0, 5) };
}

function findSuggestedReviewers(prData, repoData) {
    if (!prData || !repoData) return [];
    var changedPaths = (prData.files || []).map(function(f) { return f.filename; });
    var authorCounts = {};
    repoData.files.forEach(function(f) {
        if (changedPaths.some(function(p) { return f.folder && p.startsWith(f.folder); })) {
            var layer = f.layer || 'other';
            if (!authorCounts[layer]) authorCounts[layer] = { count: 0, files: [] };
            authorCounts[layer].count++;
            authorCounts[layer].files.push(f.name);
        }
    });
    var reviewers = [];
    Object.entries(authorCounts).sort(function(a,b) { return b[1].count - a[1].count; }).slice(0, 3).forEach(function(entry, i) {
        reviewers.push({ name: entry[0].charAt(0).toUpperCase() + entry[0].slice(1) + ' Expert', reason: 'Knows ' + entry[1].count + ' files in ' + entry[0], avatar: COLORS[i % COLORS.length] });
    });
    return reviewers;
}

function findTestImpact(prData, repoData) {
    if (!prData || !repoData) return [];
    var changedFiles = (prData.files || []).map(function(f) { return f.filename; });
    var testFiles = repoData.files.filter(function(f) { return f.name.match(/\.test\.|\.spec\.|_test\.|test_/i); });
    var impacted = [];
    testFiles.forEach(function(tf) {
        var shouldRun = changedFiles.some(function(cf) {
            var cfBase = cf.replace(/\.[^.]+$/, '').split('/').pop();
            return tf.name.toLowerCase().includes(cfBase.toLowerCase());
        });
        if (shouldRun) impacted.push({ file: tf.name, path: tf.path });
    });
    if (impacted.length === 0 && testFiles.length > 0) {
        impacted = testFiles.slice(0, 3).map(function(tf) { return { file: tf.name, path: tf.path, suggested: true }; });
    }
    return impacted;
}

function findDependencyChains(prData, repoData) {
    if (!prData || !repoData) return [];
    var changedFiles = (prData.files || []).map(function(f) { return f.filename; });
    var chains = [];
    changedFiles.slice(0, 3).forEach(function(file) {
        var chain = [file.split('/').pop()];
        var visited = new Set([file]);
        var queue = [file];
        var depth = 0;
        while (queue.length > 0 && depth < 3) {
            var current = queue.shift();
            repoData.connections.forEach(function(c) {
                var src = typeof c.source === 'object' ? c.source.id : c.source;
                var tgt = typeof c.target === 'object' ? c.target.id : c.target;
                if (tgt === current && !visited.has(src)) {
                    visited.add(src);
                    chain.push(src.split('/').pop());
                    queue.push(src);
                }
            });
            depth++;
        }
        if (chain.length > 1) chains.push(chain.slice(0, 5));
    });
    return chains;
}

    function parseUrl(url){
        if(!url||typeof url!=='string')return null;
        url=url.trim();
        if(url.length>200||url.includes('{')|| url.includes('"'))return null;
        var m=url.match(/^(?:https?:\/\/)?(?:www\.)?github\.com\/([a-zA-Z0-9_.-]+)\/([a-zA-Z0-9_.-]+)/);
        if(m)return{owner:m[1],repo:m[2].replace(/\.git$/,'')};
        var simple=url.match(/^([a-zA-Z0-9_.-]+)\/([a-zA-Z0-9_.-]+)$/);
        if(simple)return{owner:simple[1],repo:simple[2]};
        return null;
    }

    async function analyzeFromCli(force,statusHint,wantedRoot){
        var status=statusHint||cliStatus;
        if(!status||!status.ok){
            try{
                var statusRes=await fetch('/__codeflow/status');
                if(statusRes.ok){
                    var nextStatus=await statusRes.json();
                    if(nextStatus&&nextStatus.ok)status=nextStatus;
                }
            }catch(e){}
            if((!status||!status.ok)&&!force)return;
        }
        if(wantedRoot&&!cliRecordMatchesStatus({sourceKey:wantedRoot},status)){
            showNotification('Restart the CLI in that folder to re-analyze it.','warning');
            return false;
        }
        if(status&&status.ok)setCliStatus(status);
        var cliMeta=cliWatchCacheMeta(status);
        resetAnalysisState();
        setLocalDirHandle(null);
        localFolderKeyRef.current=null;
        localFolderSelectionRef.current=null;
        setLocalSourceKind('cli');
        zipArchiveRef.current=null;
        zipFileRef.current=null;
        zipKeyRef.current=null;
        setLoading(true);
        setProgress('Reading local folder from CLI...');
        try{
            await Parser.initTreeSitter().catch(function(){return null;});
            var listRes=await fetch('/__codeflow/files');
            if(!listRes.ok)throw new Error('CLI file list failed');
            var list=await listRes.json();
            var files=filterAnalyzableLocalFiles(list&&list.files?list.files:[],activeExcludePatterns);
            if(!files.length)throw new Error(activeExcludePatterns.length?'No code files found in the watched folder after applying exclude patterns':'No code files found in the watched folder');
            var analyzed=[];
            var allFns=[];
            for(var i=0;i<files.length;i++){
                var f=files[i];
                if(i>0&&i%40===0)await yieldToBrowser();
                setProgress('Analyzing '+(i+1)+'/'+files.length+': '+f.name);
                var isCodeFile=Parser.isCode(f.name);
                if(Parser.isOversized(Number(f.size))){
                    analyzed.push(makeOversizedAnalysisFile(f,f.size,isCodeFile));
                    continue;
                }
                var fileRes=await fetch('/__codeflow/file?path='+encodeURIComponent(f.path));
                var content=fileRes.ok?await fileRes.text():'';
                if(Parser.isOversized(content.length)){
                    analyzed.push(makeOversizedAnalysisFile(f,content.length,isCodeFile));
                    continue;
                }
                var layer=Parser.detectLayer(f.path);
                var actualIsCode=isCodeFile&&(!Parser.isScriptContainer(f.path)||Parser.hasEmbeddedCode(content,f.path));
                var fns=actualIsCode?Parser.extract(content,f.path):[];
                analyzed.push({path:f.path,name:f.name,folder:f.folder||'root',content:content||'',functions:fns,lines:(content||'').split('\n').length,layer:layer,churn:0,isCode:actualIsCode});
                if(actualIsCode)fns.forEach(function(fn){allFns.push(Object.assign({},fn,{folder:f.folder||'root',layer:layer}));});
            }
            var dataObj=await runAnalysisData({
                analyzed:analyzed,
                allFns:allFns,
                excludePatterns:activeExcludePatterns.map(function(x){return x.raw;}),
                progress:setProgress,
                yieldFn:yieldToBrowser
            });
            var cliInfo={owner:'local',repo:'cli',name:cliMeta.title,cliRoot:cliMeta.sourceKey};
            setData(dataObj);
            setExpandedPaths(new Set(['']));
            setRepoInfo(cliInfo);
            setCachedFromId(null);
            setCliDirty([]);
            persistCurrentAnalysis(dataObj,{sourceType:'cli',sourceKey:cliMeta.sourceKey,title:cliMeta.title,repoUrl:'',repoInfo:cliInfo,localSourceKind:'cli'});
            setLoading(false);
            return true;
        }catch(err){
            setError('CLI analysis failed: '+(err.message||err));
            setLoading(false);
        }
    }

    function analyze(forceRefresh,explicitUrl){
        var p=parseUrl(explicitUrl||repoUrl);
        if(!p){setError('Invalid URL. Use format: owner/repo');return;}
        if(explicitUrl)setRepoUrl(explicitUrl);
        var shouldForce=forceRefresh===true||forceRefreshRef.current;
        forceRefreshRef.current=false;
        var githubKey=githubCacheSourceKey(p.owner,p.repo,activeExcludePatterns);
        var cacheId=analysisCacheKey('github',githubKey);
        if(!shouldForce){
            getRecentAnalysis(cacheId).then(function(record){
                if(record&&record.data&&cachedAnalysisMatchesExcludes(record,activeExcludePatterns)){
                    applyCachedAnalysis(record);
                    return;
                }
                analyze(true);
            }).catch(function(){analyze(true);});
            return;
        }
        var currentExcludePatterns=activeExcludePatterns;
        
        // Validate authentication inputs
        if(authMethod==='pat'&&!token){
            setError('Please enter a Personal Access Token');return;
        }
        if(authMethod==='github_app'){
            if(!appId){setError('Please enter the GitHub App ID');return;}
            if(!privateKey){setError('Please set the GitHub App private key');return;}
        }
        
        resetAnalysisState();
        setLocalDirHandle(null);
        setLocalSourceKind(null);
        zipArchiveRef.current=null;
        zipFileRef.current=null;
        setLoading(true);
        setProgress('Initializing...');
        
        // Configure GitHub authentication based on method
        GitHub.token=null;
        GitHub.appId=null;
        GitHub.privateKey=null;
        GitHub.installationToken=null;
        
        if(authMethod==='pat'){
            GitHub.token=token;
        }else if(authMethod==='github_app'){
            GitHub.appId=appId;
            GitHub.privateKey=privateKey;
        }
        
        setRepoInfo(p);

        // Authentication promise - resolve immediately for no auth/PAT, authenticate for GitHub App
        var authPromise;
        if(authMethod==='github_app'){
            setProgress('Authenticating with GitHub App...');
            authPromise=GitHub.authenticateApp(p.owner,p.repo).catch(function(err){
                throw new Error('GitHub App authentication failed: '+err.message);
            });
        }else{
            authPromise=Promise.resolve();
        }
        
        authPromise.then(function(){
            setProgress('Loading language parsers...');
            return Parser.initTreeSitter().catch(function(){return null;});
        }).then(function(){
            setProgress('Checking rate limit...');
            return GitHub.getRateLimit();
        }).then(function(rl){
            var hasAuth=!!GitHub.token||authMethod==='github_app';
            var estimatedRequests=50;// Conservative estimate for a small-medium repo

            // Warn if rate limit is very low and no authentication
            if(!hasAuth&&rl.remaining<estimatedRequests){
                var resetTime=new Date(rl.reset*1000).toLocaleTimeString();
                return requestConfirm({
                    tone:'warning',
                    icon:'warning',
                    title:'GitHub API rate limit is low',
                    message:
                        'Remaining requests: '+rl.remaining+'/'+rl.limit+'\n'+
                        'Resets at: '+resetTime+'\n\n'+
                        'The folder picker is faster when the API is rate-limited. Open Folder and analyze locally, or download a ZIP and use Open ZIP.\n\n'+
                        'Without authentication, you only get 60 requests per hour.\n'+
                        'Adding a token or GitHub App raises that to 5,000 requests per hour.\n\n'+
                        'Token (PAT): GitHub Settings -> Developer Settings -> Personal access tokens\n'+
                        'GitHub App: use App ID + Private Key for organization access\n\n'+
                        'Continue anyway with the remaining requests?',
                    confirmLabel:'Continue anyway'
                }).then(function(proceed){
                    if(!proceed){
                        setLoading(false);
                        return Promise.reject('cancelled');
                    }
                    setProgress('Scanning repository...');
                    return GitHub.scan(p.owner,p.repo,setProgress,currentExcludePatterns);
                });
            }

            setProgress('Scanning repository...');
            return GitHub.scan(p.owner,p.repo,setProgress,currentExcludePatterns);
        }).then(function(files){
            if(!files)return;// Cancelled
            if(!files.length)throw new Error(currentExcludePatterns.length?'No code files found after applying exclude patterns':'No code files found');
            var SOFT_LIMIT=ANALYSIS_LIMITS.repoSoft,HARD_LIMIT=ANALYSIS_LIMITS.repoMax;
            function beginRepoAnalysis(){
                if(files.length>HARD_LIMIT){
                    showNotification('Found '+files.length+' files. Using a '+HARD_LIMIT+'-file API sample. Use Open ZIP for full analysis.','warning');
                }
                var max=Math.min(files.length,HARD_LIMIT);
                var analyzed=[];
                var allFns=[];

                function processFile(i){
                    if(i>=max){finishAnalysis();return;}
                    var f=files[i];
                    setProgress('Analyzing '+(i+1)+'/'+max+': '+f.name);
                    var isCodeFile=f.isCode!==false&&Parser.isCode(f.name);
                    if(Parser.isOversized(f.size)){
                        analyzed.push(makeOversizedAnalysisFile(f,f.size,isCodeFile));
                        processFile(i+1);
                        return;
                    }
                    if(isCodeFile){
                        Promise.all([
                            GitHub.getFile(p.owner,p.repo,f.path),
                            GitHub.getCommits(p.owner,p.repo,f.path,10).catch(function(){return[];})
                        ]).then(function(results){
                            var content=results[0];
                            var commits=results[1];
                            if(content){
                                var layer=Parser.detectLayer(f.path);
                                var actualIsCode=!Parser.isScriptContainer(f.path)||Parser.hasEmbeddedCode(content,f.path);
                                var fns=actualIsCode?Parser.extract(content,f.path):[];
                                analyzed.push({path:f.path,name:f.name,folder:f.folder,content:content,functions:fns,lines:content.split('\n').length,layer:layer,churn:Array.isArray(commits)?commits.length:0,isCode:actualIsCode});
                                if(actualIsCode){
                                    fns.forEach(function(fn){allFns.push(Object.assign({},fn,{folder:f.folder,layer:layer}));});
                                }
                            }else{
                                // Content fetch failed (rate limit, network) — keep the
                                // file visible instead of silently shrinking the repo.
                                analyzed.push(makeFetchFailedAnalysisFile(f));
                            }
                            processFile(i+1);
                        }).catch(function(){analyzed.push(makeFetchFailedAnalysisFile(f));processFile(i+1);});
                    }else{
                        GitHub.getFile(p.owner,p.repo,f.path).then(function(content){
                            var layer=Parser.detectLayer(f.path);
                            var lines=content?content.split('\n').length:0;
                            analyzed.push({path:f.path,name:f.name,folder:f.folder,content:content||'',functions:[],lines:lines,layer:layer,churn:0,isCode:false});
                            processFile(i+1);
                        }).catch(function(){
                            analyzed.push(makeFetchFailedAnalysisFile(f));
                            processFile(i+1);
                        });
                    }
                }

                async function finishAnalysis(){
                    try{
                        var dataObj=await runAnalysisData({
                            analyzed:analyzed,
                            allFns:allFns,
                            excludePatterns:currentExcludePatterns.map(function(x){return x.raw;}),
                            progress:setProgress,
                            yieldFn:yieldToBrowser
                        });
                        var failedCount=analyzed.filter(function(af){return af.analysisSkipped==='fetch-failed';}).length;
                        if(failedCount>0){
                            showNotification(failedCount+' of '+analyzed.length+' files could not be fetched (GitHub rate limit?). Results are PARTIAL — add a token or use Open ZIP for full analysis.','warning');
                        }
                        setData(dataObj);
                        setExpandedPaths(new Set(['']));
                        setCachedFromId(null);
                        persistCurrentAnalysis(dataObj,{sourceType:'github',sourceKey:githubKey,title:p.owner+'/'+p.repo,repoUrl:p.owner+'/'+p.repo,repoInfo:p,localSourceKind:null});
                        window.history.replaceState({},'',buildAppUrl(p.owner+'/'+p.repo,false));
                        setLoading(false);
                    }catch(err){
                        setError('Analysis failed: '+(err.message||err)+'. Try a smaller repository.');
                        setLoading(false);
                    }
                }

                processFile(0);
                return null;
            }

            if(files.length>SOFT_LIMIT&&files.length<=HARD_LIMIT){
                return requestConfirm({
                    tone:'warning',
                    icon:'warning',
                    title:'Analyze a large repository?',
                    message:
                        'This repository has '+files.length+' files.\n\n'+
                        'Analyzing larger repositories can take longer and may hit GitHub API rate limits.\n\n'+
                        'The folder picker is faster when the API is rate-limited. You can also download a ZIP and use Open ZIP.\n\n'+

    function refreshAnalysis(record){
        var source=record&&record.sourceType?record:null;
        var kind=source?source.sourceType:(localSourceKind||(parseUrl(repoUrl)?'github':null));
        var githubUrl=source?(source.repoUrl||source.sourceKey):repoUrl;
        setCachedFromId(null);
        if(kind==='cli'||(!source&&cliStatus&&cliStatus.ok&&localSourceKind==='cli')){
            var wantedRoot=source&&source.sourceType==='cli'?source.sourceKey:'';
            if(wantedRoot&&cliStatus&&cliStatus.ok&&!cliRecordMatchesStatus(source,cliStatus)){
                applyCachedAnalysis(source);
                showNotification('Restart the CLI in that folder to re-analyze it.','warning');
                return;
            }
            Promise.resolve(analyzeFromCli(true,cliStatus,wantedRoot||null)).then(function(ok){
                if(ok===false&&source)applyCachedAnalysis(source);
            });
            return;
        }
        if(kind==='folder'){
            var retained={sourceKey:localFolderKeyRef.current};
            var handleMatches=!source||retainedFolderMatchesRecord(source,retained);
            if(localDirHandle&&handleMatches){
                resetAnalysisState();
                setLoading(true);
                setProgress('Reading local folder...');
                readLocalFolder(localDirHandle,activeExcludePatterns);
                return;
            }
            if(localFilesRef.current&&handleMatches){
                resetAnalysisState();
                setLoading(true);
                setProgress('Reading local folder...');
                readLocalFolderFromFiles(localFilesRef.current,activeExcludePatterns);
                return;
            }
            if(source)applyCachedAnalysis(source);
            showNotification('Open Folder again to re-analyze this local tree.','warning');
            return;
        }
        if(kind==='zip'){
            var zipMatches=!source||retainedZipMatchesRecord(source,{
                sourceKey:zipKeyRef.current,
                identity:zipFileIdentity(zipFileRef.current)
            });
            if(!zipFileRef.current||!zipMatches){
                if(source)applyCachedAnalysis(source);
                showNotification('Open ZIP again to re-analyze this archive.','warning');
                return;
            }
            resetAnalysisState();
            setLocalDirHandle(null);
            setLocalSourceKind('zip');
            zipArchiveRef.current=null;
            setLoading(true);
            setProgress('Reading ZIP archive...');
            readZipArchive(zipFileRef.current,activeExcludePatterns);
            return;
        }
        if(kind==='github'||parseUrl(githubUrl)){
            analyze(true,githubUrl);
            return;
        }
        analyze(true);
    }

    async function readLocalFolder(dirHandle, compiledPatterns, path=''){
        var files=[];
        var SOFT_LIMIT=ANALYSIS_LIMITS.localSoft;
        var fileCount=0;
        setProgress('Loading language parsers...');
        await Parser.initTreeSitter().catch(function(){return null;});
        setProgress('Scanning local folder...');

        async function readDirectory(handle, currentPath){
            for await (const entry of handle.values()){
                var entryPath=currentPath?currentPath+'/'+entry.name:entry.name;
                if(entry.kind==='directory'){
                    if(!shouldIgnoreDirectory(entryPath,entry.name,compiledPatterns)){
                        await readDirectory(entry,entryPath);
                    }
                }else if(entry.kind==='file'){
                    var name=entry.name;
                    if(shouldExcludeFile(entryPath,name,compiledPatterns))continue;
                    var folder=currentPath||'root';
                    fileCount++;
                    files.push({path:entryPath,name:name,folder:folder,size:0,isCode:Parser.isCode(name),handle:entry});
                    if(fileCount%50===0){
                        setProgress('Scanning files... '+fileCount+' found');
                    }
                }
            }
        }

        await readDirectory(dirHandle,'');
        
        if(fileCount>SOFT_LIMIT){
            var proceed=await requestConfirm({
                tone:'warning',
                icon:'folder',
                title:'Analyze '+fileCount+' files?',
                message:
                    'This folder has '+fileCount+' analyzable files.\n\n'+
                    'CodeFlow will analyze every eligible file. Large folders can take minutes and use significant browser memory.\n\n'+
                    'Continue with all '+fileCount+' files?',
                confirmLabel:'Analyze all files'
            });
            if(!proceed){setLoading(false);return;}
        }
        var max=files.length;
        var analyzed=[];
        var allFns=[];

        async function processFile(i){
            if(i>=max){await finishAnalysis();return;}
            var f=files[i];
            // Yield to browser every 50 files to keep UI responsive
            if(i>0&&i%50===0)await yieldToBrowser();
            setProgress('Analyzing '+(i+1)+'/'+max+': '+f.name);
            var isCodeFile=f.isCode!==false&&Parser.isCode(f.name);
            
            try{
                var fileHandle=f.handle;
                if(isCodeFile){
                    var fileObj=await fileHandle.getFile();
                    if(Parser.isOversized(fileObj.size)){
                        analyzed.push(makeOversizedAnalysisFile(f,fileObj.size,isCodeFile));
                        processFile(i+1);
                        return;
                    }
                    var content=await fileObj.text();
                    var layer=Parser.detectLayer(f.path);
                    var actualIsCode=!Parser.isScriptContainer(f.path)||Parser.hasEmbeddedCode(content,f.path);
                    var fns=actualIsCode?Parser.extract(content,f.path):[];
                    analyzed.push({path:f.path,name:f.name,folder:f.folder,content:content,functions:fns,lines:content.split('\n').length,layer:layer,churn:0,isCode:actualIsCode});
                    if(actualIsCode){
                        fns.forEach(function(fn){allFns.push(Object.assign({},fn,{folder:f.folder,layer:layer}));});
                    }
                    processFile(i+1);
                }else{
                    var fileObj=await fileHandle.getFile();
                    if(Parser.isOversized(fileObj.size)){
                        analyzed.push(makeOversizedAnalysisFile(f,fileObj.size,isCodeFile));
                        processFile(i+1);
                        return;
                    }
                    var content=await fileObj.text();
                    var layer=Parser.detectLayer(f.path);
                    var lines=content?content.split('\n').length:0;
                    analyzed.push({path:f.path,name:f.name,folder:f.folder,content:content||'',functions:[],lines:lines,layer:layer,churn:0,isCode:false});
                    processFile(i+1);
                }
            }catch(e){
                analyzed.push({path:f.path,name:f.name,folder:f.folder,content:'',functions:[],lines:0,layer:Parser.detectLayer(f.path),churn:0,isCode:false});
                processFile(i+1);
            }
        }

        async function finishAnalysis(){
            try{
                var dataObj=await runAnalysisData({
                    analyzed:analyzed,
                    allFns:allFns,
                    excludePatterns:(compiledPatterns||[]).map(function(x){return x.raw;}),
                    progress:setProgress,
                    yieldFn:yieldToBrowser
                });
                if(!localFolderSelectionRef.current)localFolderSelectionRef.current=newLocalSelectionId();
                var folderMeta=localFolderCacheMeta({title:dirHandle&&dirHandle.name,paths:analyzed.map(function(af){return af.path;}),selectionId:localFolderSelectionRef.current});
                var folderInfo={owner:'local',repo:'folder',name:folderMeta.title,folderKey:folderMeta.sourceKey,folderSelectionId:folderMeta.selectionId};
                localFolderKeyRef.current=folderMeta.sourceKey;
                setData(dataObj);
                setExpandedPaths(new Set(['']));
                setRepoInfo(folderInfo);
                setCachedFromId(null);
                persistCurrentAnalysis(dataObj,{sourceType:'folder',sourceKey:folderMeta.sourceKey,title:folderMeta.title,repoUrl:'',repoInfo:folderInfo,localSourceKind:'folder'});
                setLoading(false);
            }catch(err){
                setError('Analysis failed: '+(err.message||err)+'. Try a smaller folder or subfolder.');
                setLoading(false);
            }
        }

        if(files.length===0){
            setError((compiledPatterns&&compiledPatterns.length)?'No code files found in the selected folder after applying exclude patterns':'No code files found in the selected folder');
            setLoading(false);
            return;
        }

        processFile(0);
    }

    async function readLocalFolderFromFiles(fileObjs,compiledPatterns){
        var patterns=compiledPatterns||activeExcludePatterns;
        var SOFT_LIMIT=ANALYSIS_LIMITS.localSoft;
        try{
            setProgress('Loading language parsers...');

            var rawPaths=fileObjs.map(function(f){return f.webkitRelativePath||f.name;});

            var files=[];
            var fileCount=0;
            var dirCache=new Map();

            fileObjs.forEach(function(fileObj){
                var rawPath=normalizeExcludePath(fileObj.webkitRelativePath||fileObj.name);

                var entryPath=rootPrefix&&rawPath.indexOf(rootPrefix)===0?rawPath.slice(rootPrefix.length):rawPath;
                entryPath=normalizeExcludePath(entryPath);

                try{

                    var content=await f.file.text();
                    var layer=Parser.detectLayer(f.path);
                    if(isCodeFile){
                        var actualIsCode=!Parser.isScriptContainer(f.path)||Parser.hasEmbeddedCode(content,f.path);

                        analyzed.push({path:f.path,name:f.name,folder:f.folder,content:content,functions:fns,lines:content.split('\n').length,layer:layer,churn:0,isCode:actualIsCode});
                        if(actualIsCode){
                            fns.forEach(function(fn){allFns.push(Object.assign({},fn,{folder:f.folder,layer:layer}));});
                        }
                    }else{
                        analyzed.push({path:f.path,name:f.name,folder:f.folder,content:content||'',functions:[],lines:content?content.split('\n').length:0,layer:layer,churn:0,isCode:false});
                    }
                }catch(e){

                }
